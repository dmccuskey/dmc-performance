[DMC_CORONA]

--==================================================--
-- option LUA_PATH, json
--
-- The folders which hold the DMC libraries, relative to
-- the project root. See dmc-corona-boot's documentation:
-- https://github.com/dmccuskey/dmc-corona-boot/blob/master/docs/configuration.md

LUA_PATH:JSON = [ "./dmc_corona" ]



[DMC_PERFORMANCE]

--==================================================--
-- option OUTPUT_MARKERS, boolean
--
-- print the time markers (markTime(), markTimeDiff()) to the console
--
-- markers are printed unless this is set to false, with the :BOOL type

OUTPUT_MARKERS:BOOL = true


--==================================================--
-- option MEMORY_ACTIVE
--
-- print the memory in use from the start of the app:
-- true: every frame
-- a number: every that many milliseconds
-- false: not at all (the default)
--
-- write it without a type (MEMORY_ACTIVE = true, MEMORY_ACTIVE = 1000):
-- MEMORY_ACTIVE:BOOL = true does nothing

-- MEMORY_ACTIVE = 1000
